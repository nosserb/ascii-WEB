<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII WEB - Générateur</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="https://i.ibb.co/Pzzfkdn8/Git-Hub-Logo-White.png" alt="GitHub Logo">
            </div>
            <h1>ASCII WEB</h1>
            <div class="tooltip">
              <div class="icon">i</div>
              <div class="tooltiptext">- Entrez votre texte -
- Choisissez une police -
- Sélectionnez une couleur -
- Cliquez sur GÉNÉRER -</div>
            </div>
        </header>
        <label class="switch">
          <input checked="true" id="theme-checkbox" type="checkbox" />
          <span class="slider">
            <div class="star star_1"></div>
            <div class="star star_2"></div>z
            <div class="star star_3"></div>
            <svg viewBox="0 0 16 16" class="cloud_1 cloud">
              <path
                transform="matrix(.77976 0 0 .78395-299.99-418.63)"
                fill="#fff"
                d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"
              ></path>
            </svg>
          </span>
        </label>

        <main class="content">
            <div class="control-panel">
                <section class="ascii-art-web">
                    <h2>ASCII ART WEB</h2>
                    <label for="text-input">VOTRE TEXTE:</label>
                    <input type="text" id="text-input" placeholder="Entrez votre texte ici">

                    <label for="font-select">POLICE D'ÉCRITURE:</label>
                    <select id="font-select" class="font-dropdown">
                        <option value="standard">Standard</option>
                        <option value="shadow">Shadow</option>
                        <option value="tinkertoy">Tinkertoy</option>
                    </select>

                    <button id="generate-button" class="btn-primary">GÉNÉRER</button>
                </section>

                <section class="color-picker">
                    <div class="color-grid">
                        <div class="color-option" style="background-color: #00ff00;" data-color="#00ff00"></div>
                        <div class="color-option selected" style="background-color: #ffffff;" data-color="#ffffff"></div>
                        <div class="color-option" style="background-color: #ff0000;" data-color="#ff0000"></div>
                        <div class="color-option" style="background-color: #0000ff;" data-color="#0000ff"></div>
                        <div class="color-option" style="background-color: #ffff00;" data-color="#ffff00"></div>
                        <div class="color-option" style="background-color: #00ffff;" data-color="#00ffff"></div>
                        <div class="color-option" style="background-color: #ff00ff;" data-color="#ff00ff"></div>
                        <div class="color-option" style="background-color: #808080;" data-color="#808080"></div>
                        <div class="color-option" style="background-color: #ffa500;" data-color="#ffa500"></div>
                        <div class="color-option" style="background-color: #ffc0cb;" data-color="#ffc0cb"></div>
                        <div class="color-option" style="background-color: #f7a38a;" data-color="#f7a38a"></div>
                        <div class="color-option" style="background-color: #87ceeb;" data-color="#87ceeb"></div>
                    </div>
                </section>
            </div>

            <div class="output-panel">
                <div class="output-box" id="ascii-output-container">
                    <pre id="ascii-output-text">Contenu de l'Art ASCII Généré</pre>
                    <button class="copy-btn" id="copy-ascii" title="Copier dans le presse-papiers"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
                    <button class="download-btn" id="download-ascii" title="Télécharger"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
